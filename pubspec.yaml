name: codingtask
description: "Smart DevHub — Developer Intelligence Dashboard. Senior-level Flutter portfolio."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3+1
  dio_smart_retry: ^6.0.0
  connectivity_plus: ^6.0.3

  # Local DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0

  # DI
  get_it: ^7.7.0

  # Routing
  go_router: ^14.1.4

  # Background processing
  workmanager: ^0.5.2

  # UI / images
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Models / immutability
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Utilities
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  very_good_analysis: ^6.0.0

  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  fake_async: ^1.3.1

  # Codegen
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
